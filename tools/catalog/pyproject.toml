[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "health-catalog"
version = "0.1.0"
description = "Read-only food catalog API and browser"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "psycopg[binary]>=3.2,<4", "uvicorn>=0.30,<1"]

[project.scripts]
health-catalog = "health_catalog.cli:main"
catalog-search-eval = "health_catalog.search_eval:main"
