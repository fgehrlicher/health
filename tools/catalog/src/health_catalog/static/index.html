<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/assets/vendor/tabulator-6.5.3/tabulator.min.css" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/assets/vendor/tabulator-6.5.3/tabulator.min.js" defer></script>
    <script src="/assets/app.js" defer></script>
    <title>Foods</title>
  </head>
  <body>
    <main class="app">
      <header class="heading">
        <div><h1>Foods</h1><p id="catalog-count">Local food catalog</p></div>
        <span id="connection-status" role="status">Connecting…</span>
      </header>
      <form id="search-form" role="search">
        <label for="search">Search foods and BLS codes</label>
        <input id="search" type="search" maxlength="100" placeholder="Name, alias, or BLS code" autocomplete="off" />
      </form>
      <section class="controls" aria-label="Filters">
        <label>Group <select id="group"><option value="">All groups</option></select></label>
        <label>Source <select id="source-name"><option value="">All sources</option></select></label>
        <label>Type <select id="kind"><option value="">All types</option></select></label>
        <label>Preparation <select id="preparation-state"><option value="">All</option></select></label>
        <label>Protein ≥ <span class="with-unit"><input id="min-protein" type="number" min="0" step="any" inputmode="decimal" placeholder="Any" /> g</span></label>
        <label>Protein / 100 kcal ≥ <span class="with-unit"><input id="min-protein-density" type="number" min="0" step="any" inputmode="decimal" placeholder="Any" /> g</span></label>
        <label>Fiber ≥ <span class="with-unit"><input id="min-fiber" type="number" min="0" step="any" inputmode="decimal" placeholder="Any" /> g</span></label>
        <label>Energy ≤ <span class="with-unit"><input id="max-energy" type="number" min="0" step="any" inputmode="decimal" placeholder="Any" /> kcal</span></label>
        <button id="clear-filters" type="button">Clear</button>
      </section>
      <section class="results" aria-labelledby="result-count">
        <div class="results-header"><h2 id="result-count" aria-live="polite">Loading…</h2><span>Values per displayed source basis · — means unknown</span></div>
        <div id="food-table" aria-label="Food table"></div>
      </section>
    </main>
    <dialog id="food-dialog" aria-labelledby="detail-title">
      <div class="dialog-header"><span>Food detail</span><button id="close-dialog" type="button" aria-label="Close">×</button></div>
      <div id="detail-content"></div>
    </dialog>
  </body>
</html>
