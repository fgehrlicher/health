[project]
name = "health"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bls4-importer", "health-catalog"]

[tool.uv.sources]
bls4-importer = { workspace = true }
health-catalog = { workspace = true }

[tool.uv.workspace]
members = ["importers/*", "tools/*"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.13,<1"]

[tool.ruff]
line-length = 100
