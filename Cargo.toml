[package]
name = "health"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[[bin]]
name = "health-db"
path = "src/bin/health-db.rs"

[[bin]]
name = "health-import"
path = "src/bin/health-import.rs"

[dependencies]
anyhow = "1.0.100"
calamine = "0.36.1"
rust_decimal = "1.43.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
