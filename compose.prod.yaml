# Production stack for the home server (health-box). See docs/deployment.md.
# Secrets are read from .env next to this file, which git does not track.
name: health

x-database-url: &database-url postgres://health:${HEALTH_DB_PASSWORD:?set HEALTH_DB_PASSWORD in .env}@postgres:5432/health

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${HEALTH_DB_PASSWORD:?set HEALTH_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    # No published port: only containers on this project's network reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=health --dbname=health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies pending migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    image: health-api
    command: ["python", "-m", "health_api.migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: health-api
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Loopback only: Hermes and local tools reach it; the network does not.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      - api
    # The home network only, at the box's fixed address: http://health.fritz.box
    ports:
      - "192.168.178.161:80:3000"
    restart: unless-stopped

volumes:
  postgres-data:
