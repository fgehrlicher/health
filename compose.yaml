services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${HEALTH_DB_PASSWORD:-health}
    ports:
      - "${HEALTH_DB_PORT:-5432}:5432"
    volumes:
      - health-postgres-data:/var/lib/postgresql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=health --dbname=health"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  health-postgres-data:
