[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bls4-importer"
version = "0.1.0"
description = "Import selected Bundeslebensmittelschlüssel 4.0 foods"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1,<4", "psycopg[binary]>=3.2,<4"]

[project.scripts]
bls4-import = "bls4_importer.cli:main"
