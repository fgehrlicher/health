[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usda-importer"
version = "0.1.0"
description = "Import USDA FoodData Central foods from the bulk downloads, and post-process them"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
usda-import = "usda_importer.cli:main"
usda-postprocess = "usda_importer.postprocess_cli:main"
